<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clarify Search audits how your business shows up in Google — paid ads, organic rankings, and the new AI answers — then fixes what's leaking. Start with a free leak check: three checks, one number, no call. Flat fees after that, month-to-month, no agency theater." />
  <meta name="theme-color" content="#f5f1e8" />
  <meta property="og:title" content="Clarify Search — Paid &amp; Organic Search Audits, Cleanups &amp; Management" />
  <meta property="og:description" content="Own more of the results page — the clicks you buy, the ones you earn, and the AI answers that now sit on top. Start with a free leak check: three checks, one number, no call." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://clarifysearch.com/" />
  <meta property="og:site_name" content="Clarify Search" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Clarify Search — Paid &amp; Organic Search Audits" />
  <meta name="twitter:description" content="Own more of the results page — the clicks you buy and the ones you earn. Start with a free leak check." />
  <link rel="canonical" href="https://clarifysearch.com/" />
  <title>Clarify Search — Paid &amp; Organic Search Audits, Cleanups &amp; Management</title>

  <!-- Entity + offer markup. A business that sells structured-data work should
       ship it: this is what lets search and answer engines state plainly who
       Clarify is, where it operates, and what each engagement costs. Ported
       verbatim from legacy/index.html now that the pricing section renders the
       offers it describes. -->
  <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "@id": "https://clarifysearch.com/#business",
    "name": "Clarify Search",
    "url": "https://clarifysearch.com/",
    "description": "Paid and organic search audits, cleanups, and month-to-month management. Clarify audits how a business shows up in Google — ads, rankings, and AI answers — then fixes what is leaking.",
    "slogan": "Own more of the results page.",
    "areaServed": { "@type": "Country", "name": "United States" },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Chicago",
      "addressRegion": "IL",
      "addressCountry": "US"
    },
    "knowsAbout": [
      "Google Ads", "Performance Max", "Shopping campaigns", "Technical SEO",
      "Content strategy", "Local SEO", "AI Overviews", "Answer engine optimization",
      "Structured data", "Google Analytics 4", "Google Search Console", "Conversion tracking"
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Search engagements",
      "itemListElement": [
        {
          "@type": "Offer",
          "name": "Leak Check",
          "description": "Three checks on one channel and a single number estimating monthly leakage. No fix list or roadmap — those are the audit.",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/LimitedAvailability"
        },
        {
          "@type": "Offer",
          "name": "Audit — Paid Search",
          "description": "Structure, search terms, match types, negatives and conversion tracking reviewed and scored, with a prioritized fix list and 90-day roadmap.",
          "price": "299",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Audit — Organic Search",
          "description": "Technical crawl, content versus buyer intent, on-page and internal linking, plus AI answer readiness.",
          "price": "349",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Audit — Both Channels",
          "description": "Paid and organic in one report, including overlap analysis of where ads buy clicks the site already ranks for.",
          "price": "549",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Audit + Cleanup — Paid Search",
          "description": "Everything in the audit, plus negatives built from real query history and budget and bidding cleanup shipped.",
          "price": "599",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "AI Solutions — Build",
          "description": "Custom AI builds inside the business: automating repeated tasks, assistants grounded in your own data, and internal tools. Scoped per build after a free scoping call, fixed price before work starts.",
          "price": "1500",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "PriceSpecification",
            "price": "1500",
            "priceCurrency": "USD",
            "valueAddedTaxIncluded": false,
            "description": "Starting price; builds are scoped and fixed-quoted individually."
          }
        },
        {
          "@type": "Offer",
          "name": "Monthly Management — Paid Search",
          "description": "Weekly query and negatives work, budget and bid optimization, monthly summary. Month-to-month, cancel anytime.",
          "price": "750",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "750",
            "priceCurrency": "USD",
            "billingIncrement": 1,
            "unitCode": "MON"
          }
        }
      ]
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="../src/main.jsx"></script>
</body>
</html>
